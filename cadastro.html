<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="description" content="Projeto Gutogram - Uma rede social para compartilhamento de fotos e vídeos.">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="instagram.css">
    <link rel="icon" href="imagens/icon.jpg" type="image/jpg">
    <title>Faça seu cadastro - Gutogram</title>
</head>
<body>

    <!-- AREA CONTAINER -->
    <div id="wrapper">

        <div id="container-cadastro">

            <!-- AREA DIREITA -->
            <div class="column">
                <div class="login-panel">
                    <div class="logo">
                        <img class ="logo-img" src="./imagens/logo.png" alt="Logo do Gutogram">
                    </div>

                    <div class="message">
                        <span>Cadastre-se para ver fotos e vídeos dos seus amigos.</span>
                    </div>

                    <button class="cta-button">
                        Entrar com o Facebook
                    </button>

                    <div class="divisor-container">
                        <div class="line"></div>
                        <div class="divisor-tag">ou</div>
                        <div class="line"></div>
                    </div>

                    <form>
                        <input placeholder="Número de celular ou email" type="text" name="email"/>
                        <input placeholder="Nome completo" type="text" name="nome"/>
                        <input placeholder="Username" type="text" name="username"/>
                        <input placeholder="Senha" type="password" name="password"/>

                        <input type="submit" value="Cadastrar"/>
                    </form>
                </div>

                <div class="infobox">
                    <p>Tem um conta? <a href="instagram.html" >Conecte-se</a></p>
                </div>

                <div class="get-app-panel">
                    Obtenha o aplicativo.

                    <di class="app-buttons">
                        <a href="#">
                          <img src="imagens/appstore.png" alt="Baixe na AppStore">  
                        </a>

                        <a href="#">
                          <img src="imagens/googleplay.png" alt="Baixe na GooglePlay">  
                        </a><a href="#"></a>
                    </di>
                </div>
            </div>
            <!-- FIM AREA DIREITA -->
        </div>

        <!-- FIM AREA CONTAINER -->

        <!-- INICIO RODAPE -->

        <footer class="footer-inner-cadastro">
            <div>
                <a href="#">About us</a>
                <a href="#">Support</a>
                <a href="#">Blog</a>
                <a href="#">Press</a>
                <a href="#">API</a>
                <a href="#">Jobs</a>
                <a href="#">Privacy</a>
                <a href="#">Terms</a>
                <a href="#">Directory</a>
                <a href="#">Profiles</a>
                <a href="#">Hashtags</a>
                <a href="#">Language</a>

                <div class="text-small">@ 2025 Instagram</div>
            </di>
        </footer>
    </div>
    
</body>
</html>
