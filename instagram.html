<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="description" content="Projeto Gutogram - Uma rede social para compartilhamento de fotos e vídeos.">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="instagram.css">

    <link rel="icon" href="imagens/icon.jpg" type="image/jpg">
    <title>Gutogram - Sua rede social!</title>
</head>
<body>

    <!-- AREA CONTAINER -->
    <div id="wrapper">

        <div id="container">

            <!-- AREA ESQUERDA -->
            <div class="column left">
                <div class="main"></div>
            </div>
            <!-- FIM AREA ESQUERDA -->


            <!-- AREA DIREITA -->
            <div class="column right">
                <div class="login-panel">
                    <div class="logo">
                        <img class ="logo-img" src="./imagens/logo.png" alt="Logo do Gutogram">
                    </div>
                    <form>
                        <input placeholder="Telefone, usuário ou email" type="text" name="username"/>
                        <input placeholder="Senha" type="password" name="password"/>

                        <input type="submit" value="Entrar" />
                    </form>
                </div>

                <div class="infobox">
                    <p>Não possui uma conta? <a href="cadastro.html" >Cadastre-se</a></p>
                </div>

                <div class="get-app-panel">
                    Obtenha o aplicativo.

                    <di class="app-buttons">
                        <a href="#">
                          <img src="imagens/appstore.png" alt="Baixe na AppStore">  
                        </a>

                        <a href="#">
                          <img src="imagens/googleplay.png" alt="Baixe na GooglePlay">  
                        </a><a href="#"></a>
                    </di>
                </div>
            </div>
            <!-- FIM AREA DIREITA -->
        </div>

        <!-- FIM AREA CONTAINER -->

        <!-- INICIO RODAPE -->

        <footer>
            <div class="footer-inner">
                <a href="#">About us</a>
                <a href="#">Support</a>
                <a href="#">Blog</a>
                <a href="#">Press</a>
                <a href="#">API</a>
                <a href="#">Jobs</a>
                <a href="#">Privacy</a>
                <a href="#">Terms</a>
                <a href="#">Directory</a>
                <a href="#">Profiles</a>
                <a href="#">Hashtags</a>
                <a href="#">Language</a>

                <div class="text-small">@ 2025 Instagram</div>
            </di>
        </footer>
    </div>
    
</body>
</html>
